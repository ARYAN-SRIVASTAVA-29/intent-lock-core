services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intentlock
      POSTGRES_USER: intentlock
      POSTGRES_PASSWORD: intentlock
    ports:
      - "5432:5432"
    volumes:
      - intentlock_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentlock -d intentlock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intentlock_postgres:
