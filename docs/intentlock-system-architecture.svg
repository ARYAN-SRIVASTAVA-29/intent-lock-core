<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IntentLock System Architecture</title>
  <desc id="desc">Research-paper style system architecture showing the untrusted commerce layer, signed authority, deterministic IntentLock control plane, privileged Razorpay execution, and persistent evidence layer.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 32px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .zone-title { font: 700 13px Arial, Helvetica, sans-serif; letter-spacing: 1.1px; fill: #334155; }
      .node-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .node-sub { font: 400 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .small { font: 600 11px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny { font: 400 10px Arial, Helvetica, sans-serif; fill: #64748b; }
      .kernel-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .control { font: 600 12px Arial, Helvetica, sans-serif; fill: #1e3a8a; }
      .decision { font: 700 13px Arial, Helvetica, sans-serif; }
      .zone { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; filter: url(#soft-shadow); }
      .authority { fill: #ffffff; stroke: #7c3aed; stroke-width: 1.5; filter: url(#soft-shadow); }
      .kernel { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.3; filter: url(#soft-shadow); }
      .control-box { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.1; }
      .execution { fill: #ffffff; stroke: #059669; stroke-width: 1.5; filter: url(#soft-shadow); }
      .evidence { fill: #f8fafc; stroke: #64748b; stroke-width: 1.3; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .data { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow-gray); }
      .allow { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .stepup { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-amber); }
      .blocked { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
      .persist { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 5; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="42" y="48" class="title">IntentLock System Architecture</text>
  <text x="42" y="75" class="subtitle">Deterministic authorization and enforcement boundary for agent-initiated commerce</text>
  <text x="1558" y="50" text-anchor="end" class="small">CONTROL PLANE + EVIDENCE PLANE</text>

  <!-- Architecture zones -->
  <rect x="36" y="112" width="238" height="540" rx="10" class="zone"/>
  <text x="54" y="140" class="zone-title">UNTRUSTED COMMERCE</text>

  <rect x="300" y="112" width="248" height="540" rx="10" class="zone"/>
  <text x="318" y="140" class="zone-title">SIGNED AUTHORITY</text>

  <rect x="574" y="112" width="480" height="540" rx="10" class="zone"/>
  <text x="592" y="140" class="zone-title">INTENTLOCK CONTROL PLANE</text>

  <rect x="1080" y="112" width="484" height="540" rx="10" class="zone"/>
  <text x="1098" y="140" class="zone-title">PRIVILEGED EXECUTION</text>

  <!-- Untrusted commerce nodes -->
  <rect x="61" y="174" width="188" height="82" rx="7" class="node"/>
  <circle cx="86" cy="203" r="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="108" y="202" class="node-title">Human User</text>
  <text x="108" y="224" class="node-sub">Intent · Budget · Quantity</text>

  <rect x="61" y="296" width="188" height="82" rx="7" class="node"/>
  <circle cx="86" cy="325" r="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="108" y="324" class="node-title">AI Buyer Agent</text>
  <text x="108" y="346" class="node-sub">Discover · Compare · Propose</text>

  <rect x="61" y="418" width="188" height="82" rx="7" class="node"/>
  <circle cx="86" cy="447" r="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="108" y="446" class="node-title">Merchant Console</text>
  <text x="108" y="468" class="node-sub">Next.js · Human approval</text>

  <rect x="61" y="540" width="188" height="72" rx="7" class="node"/>
  <text x="155" y="570" text-anchor="middle" class="node-title">Public Agent API</text>
  <text x="155" y="592" text-anchor="middle" class="node-sub">Discovery · Catalog · Policy</text>

  <!-- Signed authority nodes -->
  <rect x="325" y="174" width="198" height="100" rx="7" class="authority"/>
  <text x="424" y="201" text-anchor="middle" class="node-title">Bounded Human Mandate</text>
  <text x="424" y="223" text-anchor="middle" class="node-sub">Product · Amount · Quantity</text>
  <text x="424" y="244" text-anchor="middle" class="node-sub">Merchant · Expiry · Nonce</text>
  <text x="424" y="261" text-anchor="middle" class="tiny">Ed25519 signature</text>

  <rect x="325" y="316" width="198" height="100" rx="7" class="authority"/>
  <text x="424" y="343" text-anchor="middle" class="node-title">Merchant Checkout Truth</text>
  <text x="424" y="365" text-anchor="middle" class="node-sub">SKU · Price · Inventory</text>
  <text x="424" y="386" text-anchor="middle" class="node-sub">Currency · Payee · Hash</text>
  <text x="424" y="403" text-anchor="middle" class="tiny">Server-authoritative snapshot</text>

  <rect x="325" y="458" width="198" height="100" rx="7" class="authority"/>
  <text x="424" y="485" text-anchor="middle" class="node-title">Signed Agent Envelope</text>
  <text x="424" y="507" text-anchor="middle" class="node-sub">Agent · Mandate · Checkout</text>
  <text x="424" y="528" text-anchor="middle" class="node-sub">SKU · Quantity · Timestamp</text>
  <text x="424" y="545" text-anchor="middle" class="tiny">Ed25519 signature + idempotency key</text>

  <!-- API gateway -->
  <rect x="606" y="166" width="416" height="58" rx="7" class="node"/>
  <text x="814" y="190" text-anchor="middle" class="node-title">FastAPI Gateway and Merchant Isolation</text>
  <text x="814" y="211" text-anchor="middle" class="node-sub">Authentication · Validation · Transaction orchestration</text>

  <!-- IntentLock kernel -->
  <rect x="606" y="252" width="416" height="276" rx="9" class="kernel"/>
  <text x="814" y="282" text-anchor="middle" class="kernel-title">IntentLock Deterministic Kernel</text>
  <text x="814" y="304" text-anchor="middle" class="node-sub">All relevant checks are evaluated and persisted</text>

  <rect x="630" y="328" width="112" height="56" rx="6" class="control-box"/>
  <text x="686" y="361" text-anchor="middle" class="control">Agent Identity</text>
  <rect x="758" y="328" width="112" height="56" rx="6" class="control-box"/>
  <text x="814" y="361" text-anchor="middle" class="control">Mandate Binding</text>
  <rect x="886" y="328" width="112" height="56" rx="6" class="control-box"/>
  <text x="942" y="354" text-anchor="middle" class="control">Checkout</text>
  <text x="942" y="369" text-anchor="middle" class="control">Integrity</text>

  <rect x="630" y="402" width="112" height="56" rx="6" class="control-box"/>
  <text x="686" y="423" text-anchor="middle" class="control">Replay and</text>
  <text x="686" y="439" text-anchor="middle" class="control">Idempotency</text>
  <rect x="758" y="402" width="112" height="56" rx="6" class="control-box"/>
  <text x="814" y="423" text-anchor="middle" class="control">Policy and</text>
  <text x="814" y="439" text-anchor="middle" class="control">Spend Velocity</text>
  <rect x="886" y="402" width="112" height="56" rx="6" class="control-box"/>
  <text x="942" y="423" text-anchor="middle" class="control">Recovery</text>
  <text x="942" y="439" text-anchor="middle" class="control">Lineage</text>

  <text x="814" y="486" text-anchor="middle" class="small">Human authority ∩ Merchant truth ∩ Identity ∩ Policy ∩ Runtime safety</text>
  <text x="814" y="508" text-anchor="middle" class="tiny">Deterministic · Explainable · Hard-gated</text>

  <!-- Decisions -->
  <rect x="606" y="556" width="118" height="60" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.7"/>
  <text x="665" y="581" text-anchor="middle" class="decision" fill="#15803d">ALLOW</text>
  <text x="665" y="601" text-anchor="middle" class="tiny">all hard checks pass</text>

  <rect x="756" y="556" width="118" height="60" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
  <text x="815" y="581" text-anchor="middle" class="decision" fill="#b45309">STEP-UP</text>
  <text x="815" y="601" text-anchor="middle" class="tiny">human approval</text>

  <rect x="906" y="556" width="118" height="60" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="965" y="581" text-anchor="middle" class="decision" fill="#b91c1c">BLOCKED</text>
  <text x="965" y="601" text-anchor="middle" class="tiny">0 Razorpay calls</text>

  <!-- Privileged execution nodes -->
  <rect x="1111" y="174" width="198" height="82" rx="7" class="execution"/>
  <text x="1210" y="202" text-anchor="middle" class="node-title">Payment Orchestrator</text>
  <text x="1210" y="224" text-anchor="middle" class="node-sub">One order per transaction</text>
  <text x="1210" y="242" text-anchor="middle" class="tiny">Reachable only after ALLOW</text>

  <rect x="1335" y="174" width="198" height="82" rx="7" class="execution"/>
  <text x="1434" y="202" text-anchor="middle" class="node-title">Razorpay Test Mode</text>
  <text x="1434" y="224" text-anchor="middle" class="node-sub">Order · Checkout · Payment</text>

  <rect x="1111" y="316" width="198" height="82" rx="7" class="execution"/>
  <text x="1210" y="344" text-anchor="middle" class="node-title">Payment Verification</text>
  <text x="1210" y="366" text-anchor="middle" class="node-sub">Signature · HMAC · State</text>
  <text x="1210" y="384" text-anchor="middle" class="tiny">Amount and currency binding</text>

  <rect x="1335" y="316" width="198" height="82" rx="7" class="execution"/>
  <text x="1434" y="344" text-anchor="middle" class="node-title">Inventory Ledger</text>
  <text x="1434" y="366" text-anchor="middle" class="node-sub">Commit · Release</text>
  <text x="1434" y="384" text-anchor="middle" class="tiny">Exactly-once transition</text>

  <rect x="1111" y="458" width="422" height="100" rx="7" class="execution"/>
  <text x="1322" y="486" text-anchor="middle" class="node-title">Bounded Recovery Workflow</text>
  <text x="1322" y="508" text-anchor="middle" class="node-sub">New checkout + new signed request + original lineage</text>
  <text x="1322" y="530" text-anchor="middle" class="node-sub">Same human authority · Same IntentLock kernel</text>
  <text x="1322" y="548" text-anchor="middle" class="tiny">Cannot expand product, quantity, amount, or merchant</text>

  <!-- Primary flows -->
  <path d="M249 215 H325" class="flow"/>
  <text x="286" y="203" text-anchor="middle" class="tiny">authorize</text>
  <path d="M249 337 H286 V508 H325" class="flow"/>
  <text x="281" y="427" text-anchor="end" class="tiny">sign action</text>
  <path d="M249 459 H286 V366 H325" class="flow"/>
  <text x="281" y="394" text-anchor="end" class="tiny">checkout</text>
  <path d="M249 576 H286 V628 H560 V195 H606" class="flow"/>
  <text x="423" y="620" text-anchor="middle" class="tiny">merchant and agent APIs</text>

  <path d="M523 224 H568 V335 H606" class="flow"/>
  <path d="M523 366 H606" class="flow"/>
  <path d="M523 508 H568 V445 H606" class="flow"/>
  <path d="M814 224 V252" class="flow"/>

  <path d="M665 556 V536 H1064 V215 H1111" class="allow"/>
  <text x="1059" y="204" text-anchor="end" class="small" fill="#15803d">privileged call</text>
  <path d="M815 616 V668 H24 V215 H61" class="stepup"/>
  <text x="420" y="661" text-anchor="middle" class="small" fill="#b45309">explicit human approval</text>
  <path d="M1024 586 H1058" class="blocked"/>
  <line x1="1060" y1="570" x2="1074" y2="600" stroke="#b91c1c" stroke-width="3"/>
  <line x1="1074" y1="570" x2="1060" y2="600" stroke="#b91c1c" stroke-width="3"/>

  <path d="M1309 215 H1335" class="allow"/>
  <path d="M1434 256 V284 H1210 V316" class="data"/>
  <text x="1322" y="279" text-anchor="middle" class="tiny">verified callback / webhook</text>
  <path d="M1309 357 H1335" class="data"/>
  <path d="M1210 398 V458" class="data"/>
  <text x="1219" y="432" class="tiny">failure</text>
  <path d="M1111 508 H1064 V480 H1022" class="stepup"/>
  <text x="1060" y="469" text-anchor="middle" class="tiny">re-evaluate</text>

  <!-- Evidence plane -->
  <rect x="36" y="700" width="1528" height="158" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="54" y="729" class="zone-title">PERSISTENT EVIDENCE PLANE</text>
  <text x="1546" y="729" text-anchor="end" class="tiny">merchant-scoped and queryable</text>

  <rect x="66" y="758" width="270" height="68" rx="7" class="evidence"/>
  <text x="201" y="786" text-anchor="middle" class="node-title">PostgreSQL State</text>
  <text x="201" y="808" text-anchor="middle" class="node-sub">Transactions · Nonces · Payments · Stock</text>

  <rect x="436" y="758" width="270" height="68" rx="7" class="evidence"/>
  <text x="571" y="786" text-anchor="middle" class="node-title">SHA-256 Audit Ledger</text>
  <text x="571" y="808" text-anchor="middle" class="node-sub">Canonical event + previous-event hash</text>

  <rect x="806" y="758" width="270" height="68" rx="7" class="evidence"/>
  <text x="941" y="786" text-anchor="middle" class="node-title">Transaction Passport</text>
  <text x="941" y="808" text-anchor="middle" class="node-sub">Intent · Checks · Payment · Inventory</text>

  <rect x="1176" y="758" width="352" height="68" rx="7" class="evidence"/>
  <text x="1352" y="786" text-anchor="middle" class="node-title">Control-Room Telemetry</text>
  <text x="1352" y="808" text-anchor="middle" class="node-sub">Allowed · Blocked · Step-up · Recovery · GMV</text>

  <path d="M336 792 H436" class="data"/>
  <path d="M706 792 H806" class="data"/>
  <path d="M1076 792 H1176" class="data"/>

  <path d="M814 652 V680 H201 V758" class="persist"/>
  <text x="499" y="675" text-anchor="middle" class="tiny">persist decision state</text>
  <path d="M965 616 V684 H571 V758" class="persist"/>
  <text x="752" y="696" text-anchor="middle" class="tiny">append decision evidence</text>
  <path d="M1322 558 V682 H1352 V758" class="persist"/>
  <text x="1393" y="677" class="tiny">payment and recovery state</text>

  <!-- Legend -->
  <line x1="42" y1="881" x2="76" y2="881" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="88" y="885" class="tiny">request / control flow</text>
  <line x1="230" y1="881" x2="264" y2="881" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/>
  <text x="276" y="885" class="tiny">persistence / evidence</text>
  <text x="1558" y="885" text-anchor="end" class="tiny">Figure 1 · IntentLock reference architecture</text>
</svg>
